# docker-compose.yml — in your patched hass-mcp fork dir
# restart:
# docker compose up -d --force-recreate
# check logs
# docker compose logs -f ha-mcp
services:
  ha-mcp:
    build: .                      # builds YOUR fork, not voska/hass-mcp:latest
    container_name: ha-mcp
    restart: unless-stopped
    # --http + 0.0.0.0 so the published port is reachable through the bridge
    command: ["--http", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"     # localhost-only: reachable by host-networked Hermes, NOT the LAN
    env_file:
      - .env                      # keep HA_TOKEN here, gitignored
    environment:
      - HASS_MCP_ALLOWLIST_FILE=/data/allowlist.txt
      # - HASS_MCP_CONTROL_DENYLIST_FILE=/data/denylist.txt
      # read-only defaults are implicit; listed here for clarity:
      - HASS_MCP_ENABLE_DIAGNOSTICS=false
      - HASS_MCP_ENABLE_CONTROL=false
      - HASS_MCP_ENABLE_PROMPTS=false
      - TZ=America/Denver
    volumes:
      - ./allowlist.txt:/data/allowlist.txt:ro
      # - ./denylist.txt:/data/denylist.txt:ro
      - ./scripts:/app/scripts:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(5); s.connect(('localhost',8000)); s.close()"]
      interval: 2m
      timeout: 10s
      start_period: 30s
      retries: 3